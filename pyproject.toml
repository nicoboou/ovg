[project]
name = "ovg"
version = "0.1.0"
readme = "README.md"

requires-python = ">=3.9"
# Core dependencies for training and inference
dependencies = [
    "diffusers>=0.32.2",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.49.0",
    "accelerate==1.4.0",
    "wandb>=0.19.6",
    "torchmetrics>=1.6.1",
    "tqdm>=4.67.1",
    "torch-fidelity>=0.3.0",
    "lpips>=0.1.4",
    "pytorch-msssim>=1.0.0",
    "peft>=0.14.0",
    "datasets>=3.3.2",
    "xformers==0.0.28.post3",
    "scikit-learn>=1.6.1",
    "hydra-core>=1.3.2",
    "opencv-python",
    "scikit-image",
    "sentencepiece>=0.2.0",
    "submitit>=1.5.3",
    "h5py>=3.14.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",
]

# Optional dependencies grouped by use case
[project.optional-dependencies]
# Development tools
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

# Jupyter notebook environment
notebook = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.0",
    "ipywidgets>=8.1.7",
    "plotly>=6.2.0",
    "nbformat>=5.10.4",
    "umap-learn",
]

# HPC-specific dependencies
hpc = [
    "mpi4py>=3.1.0",
    "horovod>=0.28.0",
    "submitit>=1.5.0",
]

# All optional dependencies
all = [
    "ovg[dev,notebook,hpc]",
]

[tool.ruff]
ignore = [
    "E501", # Never enforce `E501` (line length violations).
    "E731", # Do not assign a lambda expression, use a def
]
line-length = 119
indent-width = 4
target-version = "py310"

[tool.ruff.per-file-ignores]
"__init__.py" = [
    "F401", # imported but unused
    "E402", # Module level import not at top of file
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

[tool.ruff.pycodestyle]
max-doc-length = 150

[tool.black]
line-length = 119
target-version = ['py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | outputs
)/
'''

[tool.uv]

[tool.setuptools.packages.find]
include = ["ovg*"]
exclude = ["outputs*", "tests*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
